name: Spring PetClinic CI/CD – Staging

on:
  push:
    branches:
      - staging

env:
  IMAGE_NAME: spring-project
  DOCKERHUB_USERNAME: bibek49

jobs:
  build-docker-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Build WAR with Maven
        run: mvn clean package -DskipTests

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t $DOCKERHUB_USERNAME/$IMAGE_NAME:${{ github.run_number }} \
            -t $DOCKERHUB_USERNAME/$IMAGE_NAME:latest .

      - name: Push Docker image
        run: |
          docker push $DOCKERHUB_USERNAME/$IMAGE_NAME:${{ github.run_number }}
          docker push $DOCKERHUB_USERNAME/$IMAGE_NAME:latest
